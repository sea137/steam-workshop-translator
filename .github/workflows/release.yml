name: Build and publish HaijingTools
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/release.yml'
      - 'tests/**'
      - 'backend/**'
      - 'webview/**'
      - 'frontend/**'
      - 'offline/**'
      - 'scripts/**'
permissions:
  contents: read
concurrency:
  group: haijing-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Check the packed Lua backend (including UTF-8 and rate limiting)
        run: |
          python -m pip install lupa==2.8
          python tests/release_backend_test.py workshop-translator.star
          python tests/offline_test.py
          python tests/offline_busy_test.py
          ./tests/recovery_test.ps1
      - name: Package release
        shell: pwsh
        run: |
          python scripts/Fetch-Model.py out/translate-en_zh-1_9.argosmodel
          ./scripts/Pack-Release.ps1 -ModelPath out/translate-en_zh-1_9.argosmodel
      - name: Publish version if absent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = 'v' + $version
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; leaving it unchanged."; exit 0 }
          gh release create $tag "out/HaijingTools-v$version-Windows.zip" "out/HaijingTools-v$version-Windows-WithModel.zip" out/translate-en_zh-1_9.argosmodel out/dictionary-starter.json out/workshop-translator.star out/SHA256SUMS.txt --target $env:RELEASE_TARGET --title "海京Tools $version · 分段重试与阅读体验" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
